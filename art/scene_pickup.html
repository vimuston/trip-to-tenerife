<script>

function n2(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function vn(x,y,s){const gx=Math.floor(x/s),gy=Math.floor(y/s),fx=x/s-gx,fy=y/s-gy;
 const a=n2(gx,gy),b=n2(gx+1,gy),c=n2(gx,gy+1),d=n2(gx+1,gy+1),u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
// ---------- static background ----------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;const b=bg.getContext('2d');
const R=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x|0,y|0,w|0,h|0)};

function buildBG(){
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){

 R(b,0,222,W,12,C.paveA);for(let x=0;x<W;x+=16)R(b,x,222,1,12,C.paveB);R(b,0,227,W,1,C.paveB);
 R(b,0,234,W,1,C.curb);R(b,0,235,W,1,C.curbd);
 R(b,0,236,W,54,C.asph);
 for(let y=236;y<290;y++)for(let x=0;x<W;x++){const n=n2(x+50,y);if(n<.1)P(b,x,y,C.asph2);else if(n>.94)P(b,x,y,C.asph3)}

 for(let y=134;y<224;y++)for(let x=82;x<110;x++){if((x<84||x>=108||n2(x,y)>.97)&&n2(x+3,y)>.55)P(b,x,y,C.snow)}

}

function pine(c,cx,base,sc){const tiers=4;R(c,cx-2,base-6,4,8,C.trunk);
 for(let t=0;t<tiers;t++){const top=base-8-(tiers-t)*0*0;const h=Math.round(15*sc),y0=base-8-(t+1)*Math.round(11*sc)+Math.round(8*sc),hw=Math.round((5+(tiers-t)*0+(t+1)*3.2)*sc);

}
function birch(c,x,base){

 R(c,x,base-52,5,54,C.bark);R(c,x+4,base-52,1,54,C.snow3);
 for(let y=base-50;y<base;y+=5){const k=n2(y,x)>.5;R(c,x+(k?0:2),y,k?3:2,1,C.ink)}
 const blobs=[[x-9,base-60,11,C.leaf3],[x+14,base-58,11,C.leaf3],[x+2,base-72,12,C.leaf3],[x-6,base-72,9,C.leaf1],[x+14,base-70,9,C.leaf1],[x+4,base-60,10,C.leaf1],[x-2,base-78,8,C.leaf2]];

 for(let i=0;i<110;i++){const a=n2(i,5)*6.28,d=n2(i,6)*20;const px=Math.round(x+2+Math.cos(a)*d*.9),py=Math.round(base-66+Math.sin(a)*d*.8);
  P(c,px,py,i%4?C.leaf2:C.leaf4)}
}
function win(c,x,y,w,h){R(c,x-1,y-1,w+2,h+2,C.frame);
 for(let r=0;r<h;r++)R(c,x,y+r,w,1,r<h*.45?C.win1:(r<h*.8?C.win2:C.win3));
 R(c,x+(w>>1)-0,y,1,h,C.frame);R(c,x,y+(h>>1),w,1,C.frame);

 R(c,x-2,y+h+1,w+4,2,C.wall2);R(c,x-2,y+h+3,w+4,1,'rgba(0,0,0,.18)')}
function house(c){
 // chimney
 R(c,118,6,12,26,C.brick);for(let y=9;y<32;y+=4)R(c,118,y,12,1,C.brick2);R(c,116,4,16,3,'#4d4c58');R(c,116,3,16,1,C.snow);
 // roof

  for(let x=lx;x<=rx;x++){const row=(y-22)>>2,off=(row&1)*3;let col=C.roof1;
   const m=(y-22)&3;if(m==0)col=C.roof3;else if(m==3)col=C.roof4;
   if(((x+off)%7)==0&&m>0)col=C.roof2;
   if(y<26&&n2(x,y)>(y-22)*.18+.18)col=n2(x+1,y)>.4?C.snow:C.snow2;

 R(c,40,56,112,2,'#2a2f4c');R(c,42,58,108,2,'rgba(30,36,70,.5)');
 // wall
 R(c,46,58,100,76,C.wall);
 for(let y=60;y<128;y+=4){R(c,46,y,100,1,C.wall2);R(c,46,y+1,100,1,C.wall3)}
 R(c,46,58,2,76,C.wall3);R(c,144,58,2,76,C.wall3);R(c,144,58,2,76,C.wall2);
 R(c,46,126,100,8,C.stone);for(let x=46;x<146;x+=6)R(c,x+((x>>1)&2),126,1,8,C.stone2);R(c,46,126,100,1,C.stone2);
 // windows
 win(c,56,64,14,18);win(c,89,64,14,18);win(c,122,64,14,18);
 win(c,56,96,14,20);win(c,122,96,14,20);
 // door
 R(c,88,102,16,32,C.frame);R(c,89,103,14,31,C.door);R(c,91,106,4,10,C.door2);R(c,97,106,4,10,C.door2);R(c,91,119,10,12,C.door2);
 R(c,91,106,4,1,'#9a6439');R(c,97,106,4,1,'#9a6439');P(c,101,119,C.win2);P(c,101,120,C.win2);
 R(c,86,134,20,4,'#8d8a98');R(c,86,134,20,1,C.snow2);R(c,84,138,24,2,'#5f5b6c');

 R(c,82,108,3,5,'#2a2d3a');R(c,83,109,1,3,C.win1);

}
// ---------- sprites ----------
function shapes(c,list,ox,oy,dir){
 for(const [x,y,w,h] of list)R(c,ox+x-1,oy+y-1,w+2,h+2,C.ink);
}
function person(c,x,y,o,t,walking){
 const adult=o.kind==='a',bob=walking?(Math.floor(t*7)&1):0,leg=walking?(Math.floor(t*7)&1):0;
 const fy=y-bob; // feet y
 const S=adult?{h:22}:{h:17};
 const sh=[];
 const add=(a,col)=>sh.push([a,col]);
 if(adult){
  add([-4,-22,8,4],o.hair);add([-3,-19,6,5],C.skin);
  if(o.long){add([-5,-21,2,9],o.hair);add([3,-21,2,9],o.hair)}
  if(o.glasses){}

  add([-7,-13,2,8],o.jacket);add([5,-13,2,8],o.jacket);add([-7,-5,2,2],C.skin);add([5,-5,2,2],C.skin);
  add([-4,-5,3,4+(leg?1:0)],o.pants);add([1,-5,3,4+(leg?0:1)],o.pants);

 }else{
  add([-4,-17,8,5],o.hat||o.hair);if(o.hat)add([-4,-13,8,1],o.hair);
  add([-3,-13,6,4],C.skin);
  add([-4,-9,8,6],o.jacket);add([-4,-4,8,1],o.jdark);
  add([-6,-8,2,5],o.jacket);add([4,-8,2,5],o.jacket);
  add([-3,-3,3,3+(leg?1:0)],o.pants);add([0,-3,3,3+(leg?0:1)],o.pants);
 }
 for(const [a] of sh)R(c,x+a[0]-1,fy+a[1]-1,a[2]+2,a[3]+2,C.ink);
 for(const [a,col] of sh)R(c,x+a[0],fy+a[1],a[2],a[3],col);
 // face
 if(adult){P(c,x-2,fy-17,C.ink);P(c,x+1,fy-17,C.ink);if(o.glasses)R(c,x-3,fy-18,6,1,'#3a3a4a');if(o.beard)R(c,x-2,fy-15,4,1,o.hair)}
 else{P(c,x-2,fy-11,C.ink);P(c,x+1,fy-11,C.ink);P(c,x-2,fy-9,C.skin2)}
 if(o.pom)R(c,x-1,fy-19,3,2,'#ffffff');
}
function suitcase(c,x,y,col){R(c,x-1,y-9,8,10,C.ink);R(c,x,y-8,6,8,col);R(c,x,y-5,6,1,'rgba(0,0,0,.25)');R(c,x+2,y-12,2,3,C.ink);R(c,x,y+1,2,1,C.ink);R(c,x+4,y+1,2,1,C.ink)}
function taxi(c,x,y,t){
 // 40x19, facing right, side view (y = ground contact line)
 R(c,x-1,y-10,42,10,C.ink);R(c,x+2,y-16,28,8,C.ink);R(c,x+11,y-19,14,4,C.ink);
 R(c,x,y-9,40,8,C.taxi);R(c,x,y-4,40,3,C.taxi2);R(c,x+3,y-15,26,7,C.taxi);
 R(c,x+5,y-14,10,6,C.glass);R(c,x+17,y-14,10,6,C.glass);R(c,x+5,y-14,10,1,C.glass2);R(c,x+17,y-14,10,1,C.glass2);R(c,x+16,y-15,1,7,C.taxi2);
 R(c,x+12,y-18,12,3,C.ink);R(c,x+13,y-17,10,2,C.taxi3);
 R(c,x,y-9,40,1,C.taxi3);

 for(const wx of [x+7,x+29]){disc(c,wx+3,y-1,4,C.ink);disc(c,wx+3,y-1,3,'#2c2c3a');P(c,wx+3,y-1,'#9aa0b4');P(c,wx+2,y-1,'#9aa0b4')}
 R(c,x+3,y,36,1,'rgba(10,10,30,.35)');
}
// ---------- text & UI ----------
const FONT='8px "Press Start 2P", monospace';
function box(c,x,y,w,h){R(c,x,y,w,h,'#f4f4ff');R(c,x+1,y+1,w-2,h-2,'#0c1458');

 for(const [dx,dy] of [[0,0],[w-1,0],[0,h-1],[w-1,h-1]])P(c,x+dx,y+dy,'#000000');}

const LINES=[
 {who:'TAKSIKUSKI',txt:'Hei! Taksi Oulun lentokentälle on valmis!',t:0.6},
 {who:'ÄITI A',txt:'Hienoa! Laukut kyytiin, lapset!',t:5.2},

const CYCLE=15;

 {kind:'a',hair:'#e8c765',long:true,jacket:'#2fa39a',jdark:'#1f7a74',pants:'#33405e',delay:0,fx:100,name:'mum'},

let start=performance.now();
function frame(now){

 glow(96,118,22,.2);glow(83,111,12,.2);glow(27,189,34,.2);
